<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <table>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>25</td>
            <td>Java</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Vishal</td>
            <td>24</td>
            <td>Python</td>
        </tr>
    </table>

    <hr>

    <p class="important">Important Message</p>
    <p class="normal">Normal Message</p>

    <h2 class="title">Puducts</h2>
    <p class="title">Latest Products</p>
    <div class="title">Product Section</div>

    <hr>

    <h1>Heading</h1>
    <h3>Sub-Heading</h3>
    <p>Paragraph</p>

    <hr>

    <div class="card">
        <div class="subCard">
            <h2>Laptop</h2>
            <p>99,999</p>
        </div>
        <h2>
            Mobile
        </h2>
    </div>
</body>

</html>
